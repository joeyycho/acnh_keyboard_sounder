name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke-build:
    name: Smoke build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps for pygame / tkinter / pynput
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev libsdl2-mixer-2.0-0

      - name: Install Python deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Check Windows-safe sound filenames
        run: python scripts/check_sound_filenames.py

      - name: PyInstaller smoke build
        run: python -m PyInstaller --noconfirm --clean KeyboardSounder.spec

      - name: Verify binary exists
        run: test -f dist/KeyboardSounder && ls -la dist/
